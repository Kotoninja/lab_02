[project]
name = "streamstats"
version = "0.1.0"
description = "CSV and JSON analyzer"
requires-python = ">=3.12"
dependencies = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.coverage.run]
source = ["src/streamstats"]
omit = [
    "src/streamstats/__main__.py",
    "tests/*",
]
